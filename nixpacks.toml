# Nixpacks configuration for Railway deployment
[phases.setup]
nixPkgs = ["...", "php83", "php83Extensions.pdo", "php83Extensions.pdo_sqlite", "php83Extensions.pdo_mysql", "php83Extensions.mbstring", "php83Extensions.xml", "php83Extensions.curl", "php83Extensions.gd", "php83Extensions.zip", "php83Extensions.bcmath", "php83Extensions.tokenizer", "php83Extensions.fileinfo", "php83Extensions.openssl", "php83Extensions.ctype", "php83Extensions.session", "php83Extensions.dom"]

[phases.install]
cmds = [
    "mkdir -p /etc/php83",
    "cp /etc/php83/php.ini /etc/php83/php.ini.bak 2>/dev/null || true",
    "echo 'memory_limit=512M' >> /etc/php83/php.ini 2>/dev/null || true",
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm ci --production=false"
]

[phases.build]
cmds = [
    "npm run build",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache"
]

[start]
cmd = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
